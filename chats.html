<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeeGram - Чаты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        body {
            background-color: #383838;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Левая панель - список чатов */
        .chats-sidebar {
            width: 400px;
            background-color: #4C4C4C;
            border-right: 1px solid #666;
            display: flex;
            flex-direction: column;
        }

        /* Шапка левой панели */
        .sidebar-header {
            padding: 20px;
            background-color: #4C4C4C;
            border-bottom: 1px solid #666;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .burger-menu {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .burger-line {
            width: 100%;
            height: 2px;
            background-color: #FFFFFF;
            border-radius: 2px;
        }

        .search-container {
            flex: 1;
            margin: 0 15px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background-color: #383838;
            border: none;
            border-radius: 20px;
            padding: 10px 40px 10px 15px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: #aaa;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        /* Список чатов */
        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chats-title {
            padding: 15px 20px 10px;
            font-size: 16px;
            font-weight: 600;
            color: #aaa;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border-left: 3px solid transparent;
        }

        .chat-item:hover {
            background-color: #5a5a5a;
        }

        .chat-item.active {
            background-color: #5a5a5a;
            border-left-color: #1D9F7A;
        }

        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1D9F7A, #178066);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .bot-avatar {
            background: linear-gradient(135deg, #1D9F7A, #178066);
        }

        .test-avatar {
            background: linear-gradient(135deg, #1D9F7A, #178066);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-time {
            font-size: 12px;
            color: #aaa;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .chat-last-message {
            font-size: 14px;
            color: #aaa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .unread-badge {
            background-color: #1D9F7A;
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
            margin-left: 10px;
            flex-shrink: 0;
        }

        /* Правая панель - сообщения */
        .messages-panel {
            flex: 1;
            background-color: #383838;
            display: flex;
            flex-direction: column;
        }

        /* Шапка правой панели */
        .messages-header {
            padding: 15px 20px;
            background-color: #4C4C4C;
            border-bottom: 1px solid #666;
            display: flex;
            align-items: center;
        }

        .back-button {
            display: none;
            margin-right: 15px;
            cursor: pointer;
            color: #1D9F7A;
        }

        .current-chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1D9F7A, #178066);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .current-chat-info {
            flex: 1;
        }

        .current-chat-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .current-chat-status {
            font-size: 13px;
            color: #aaa;
        }

        .header-actions {
            display: flex;
            gap: 20px;
            color: #aaa;
        }

        .header-actions i {
            cursor: pointer;
            font-size: 18px;
        }

        /* Область сообщений */
        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .welcome-message {
            text-align: center;
            color: #aaa;
            font-size: 16px;
            margin-top: 50px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            position: relative;
        }

        .message-incoming {
            align-self: flex-start;
            background-color: #4C4C4C;
            border-bottom-left-radius: 4px;
        }

        .message-outgoing {
            align-self: flex-end;
            background-color: #1D9F7A;
            border-bottom-right-radius: 4px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 11px;
            color: #aaa;
            text-align: right;
            margin-top: 4px;
        }

        /* Панель ввода сообщения */
        .input-container {
            padding: 15px 20px;
            background-color: #4C4C4C;
            border-top: 1px solid #666;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .input-actions {
            display: flex;
            gap: 15px;
            color: #aaa;
        }

        .input-actions i {
            cursor: pointer;
            font-size: 20px;
        }

        .message-input {
            flex: 1;
            background-color: #383838;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            outline: none;
            resize: none;
            max-height: 100px;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .message-input::placeholder {
            color: #aaa;
        }

        .send-button {
            width: 40px;
            height: 40px;
            background-color: #1D9F7A;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

        .send-button:hover {
            background-color: #178066;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .chats-sidebar {
                width: 100%;
            }
            
            .messages-panel {
                display: none;
            }
            
            .messages-panel.active {
                display: flex;
            }
            
            .back-button {
                display: block;
            }
        }

        /* Скрываем скроллбар но оставляем функциональность */
        .chats-list::-webkit-scrollbar {
            width: 6px;
        }

        .chats-list::-webkit-scrollbar-track {
            background: #383838;
        }

        .chats-list::-webkit-scrollbar-thumb {
            background: #1D9F7A;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #383838;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #1D9F7A;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Левая панель - список чатов -->
        <div class="chats-sidebar">
            <div class="sidebar-header">
                <div class="burger-menu">
                    <div class="burger-line"></div>
                    <div class="burger-line"></div>
                    <div class="burger-line"></div>
                </div>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Поиск">
                    <div class="search-icon"></div>
                </div>
            </div>

            <div class="chats-title">Чаты</div>

            <div class="chats-list">
                <div class="chat-item active" data-chat="botfather">
                    <div class="chat-avatar bot-avatar">B</div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <div class="chat-name">BotFather</div>
                            <div class="chat-time">plaggy_pidoras</div>
                        </div>
                        <div class="chat-last-message">self.test_message1</div>
                    </div>
                    <div class="unread-badge">1</div>
                </div>

                <div class="chat-item" data-chat="test">
                    <div class="chat-avatar test-avatar">T</div>
                    <div class="chat-info">
                        <div class="chat-header">
                            <div class="chat-name">test</div>
                            <div class="chat-time">plaggy_pidoras</div>
                        </div>
                        <div class="chat-last-message">self.test_message1</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая панель - сообщения -->
        <div class="messages-panel">
            <div class="messages-header">
                <div class="back-button">←</div>
                <div class="current-chat-avatar bot-avatar">B</div>
                <div class="current-chat-info">
                    <div class="current-chat-name">BotFather</div>
                    <div class="current-chat-status">self.bot_botfather-id1</div>
                </div>
                <div class="header-actions">
                    <i></i>
                    <i>⋮</i>
                </div>
            </div>

            <div class="messages-container">
                <div class="welcome-message">
                    Выберите чат для начала общения
                </div>
                
                <!-- Сообщения будут добавляться здесь динамически -->
            </div>

            <div class="input-container">
                <div class="input-actions">
                    <i></i>
                    <i></i>
                </div>
                <textarea class="message-input" placeholder="Сообщение" rows="1"></textarea>
                <button class="send-button">↑</button>
            </div>
        </div>
    </div>

    <script>
        // Данные чатов и сообщений
        const chatsData = {
            botfather: {
                name: "BotFather",
                avatar: "B",
                status: "self.bot_botfather-id1",
                messages: [
                    { text: "self.test_message1", incoming: true, time: "12:25" },
                    { text: "test", incoming: false, time: "12:26" },
                    { text: "self.test_message1", incoming: true, time: "12:30" }
                ]
            },
            test: {
                name: "test", 
                avatar: "T",
                status: "self.bot_test-id2",
                messages: [
                    { text: "self.test_message1", incoming: true, time: "11:40" },
                    { text: "test message", incoming: false, time: "11:42" },
                    { text: "self.test_message1", incoming: true, time: "11:45" }
                ]
            }
        };

        let currentChat = 'botfather';

        // Функция для отображения сообщений чата
        function displayChat(chatId) {
            const chatData = chatsData[chatId];
            if (!chatData) return;

            currentChat = chatId;

            // Обновляем заголовок
            document.querySelector('.current-chat-name').textContent = chatData.name;
            document.querySelector('.current-chat-status').textContent = chatData.status;
            document.querySelector('.current-chat-avatar').textContent = chatData.avatar;
            document.querySelector('.current-chat-avatar').className = `current-chat-avatar ${chatId === 'botfather' ? 'bot-avatar' : 'test-avatar'}`;

            // Очищаем контейнер сообщений
            const messagesContainer = document.querySelector('.messages-container');
            messagesContainer.innerHTML = '';

            // Добавляем сообщения
            chatData.messages.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${message.incoming ? 'message-incoming' : 'message-outgoing'}`;
                
                messageElement.innerHTML = `
                    <div class="message-text">${message.text}</div>
                    <div class="message-time">${message.time}</div>
                `;
                
                messagesContainer.appendChild(messageElement);
            });

            // Прокручиваем вниз
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Обновляем активный чат в списке
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.chat === chatId) {
                    item.classList.add('active');
                }
            });

            // На мобильных устройствах показываем панель сообщений
            if (window.innerWidth <= 768) {
                document.querySelector('.messages-panel').classList.add('active');
                document.querySelector('.chats-sidebar').style.display = 'none';
            }
        }

        // Функция для отправки сообщения
        function sendMessage() {
            const input = document.querySelector('.message-input');
            const text = input.value.trim();
            
            if (text) {
                const chatData = chatsData[currentChat];
                const now = new Date();
                const time = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                // Добавляем сообщение в данные
                chatData.messages.push({
                    text: text,
                    incoming: false,
                    time: time
                });

                // Обновляем отображение
                displayChat(currentChat);

                // Очищаем поле ввода
                input.value = '';

                // Авто-ответ (для демонстрации)
                setTimeout(() => {
                    chatData.messages.push({
                        text: "self.test_message1",
                        incoming: true,
                        time: `${now.getHours()}:${(now.getMinutes() + 1).toString().padStart(2, '0')}`
                    });
                    displayChat(currentChat);
                }, 1000);
            }
        }

        // Обработчики событий
        document.addEventListener('DOMContentLoaded', function() {
            const chatItems = document.querySelectorAll('.chat-item');
            const sendButton = document.querySelector('.send-button');
            const messageInput = document.querySelector('.message-input');
            const backButton = document.querySelector('.back-button');

            // Выбор чата
            chatItems.forEach(item => {
                item.addEventListener('click', () => {
                    displayChat(item.dataset.chat);
                });
            });

            // Отправка сообщения
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Авто-высота текстового поля
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Кнопка назад на мобильных
            backButton.addEventListener('click', () => {
                document.querySelector('.messages-panel').classList.remove('active');
                document.querySelector('.chats-sidebar').style.display = 'flex';
            });

            // Инициализация первого чата
            displayChat(currentChat);
        });
    </script>
</body>
</html>
