<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        body {
            background-color: #383838;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Левая панель - список чатов */
        .chats-sidebar {
            width: 400px;
            background-color: #4C4C4C;
            border-right: 1px solid #666;
            display: flex;
            flex-direction: column;
        }

        /* Шапка левой панели */
        .sidebar-header {
            padding: 20px;
            background-color: #4C4C4C;
            border-bottom: 1px solid #666;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .burger-menu {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .burger-line {
            width: 100%;
            height: 2px;
            background-color: #FFFFFF;
            border-radius: 2px;
        }

        .search-container {
            flex: 1;
            margin: 0 15px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background-color: #383838;
            border: none;
            border-radius: 20px;
            padding: 10px 40px 10px 15px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: #aaa;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        /* Список чатов */
        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chats-title {
            padding: 15px 20px 10px;
            font-size: 16px;
            font-weight: 600;
            color: #aaa;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border-left: 3px solid transparent;
        }

        .chat-item:hover {
            background-color: #5a5a5a;
        }

        .chat-item.active {
            background-color: #5a5a5a;
            border-left-color: #1D9F7A;
        }

        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1D9F7A, #178066);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .bot-avatar {
            background: linear-gradient(135deg, #1D9F7A, #178066);
        }

        .user-avatar {
            background: linear-gradient(135deg, #1D9F7A, #178066);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-time {
            font-size: 12px;
            color: #aaa;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .chat-last-message {
            font-size: 14px;
            color: #aaa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .unread-badge {
            background-color: #1D9F7A;
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
            margin-left: 10px;
            flex-shrink: 0;
        }

        /* Правая панель - сообщения */
        .messages-panel {
            flex: 1;
            background-color: #383838;
            display: flex;
            flex-direction: column;
        }

        /* Шапка правой панели */
        .messages-header {
            padding: 15px 20px;
            background-color: #4C4C4C;
            border-bottom: 1px solid #666;
            display: flex;
            align-items: center;
        }

        .back-button {
            display: none;
            margin-right: 15px;
            cursor: pointer;
            color: #1D9F7A;
        }

        .current-chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1D9F7A, #178066);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .current-chat-info {
            flex: 1;
        }

        .current-chat-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .current-chat-status {
            font-size: 13px;
            color: #aaa;
        }

        .header-actions {
            display: flex;
            gap: 20px;
            color: #aaa;
        }

        .header-actions i {
            cursor: pointer;
            font-size: 18px;
        }

        /* Область сообщений */
        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .welcome-message {
            text-align: center;
            color: #aaa;
            font-size: 16px;
            margin-top: 50px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            position: relative;
        }

        .message-incoming {
            align-self: flex-start;
            background-color: #4C4C4C;
            border-bottom-left-radius: 4px;
        }

        .message-outgoing {
            align-self: flex-end;
            background-color: #1D9F7A;
            border-bottom-right-radius: 4px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .message-time {
            font-size: 11px;
            color: #aaa;
            text-align: right;
            margin-top: 4px;
        }

        /* Панель ввода сообщения */
        .input-container {
            padding: 15px 20px;
            background-color: #4C4C4C;
            border-top: 1px solid #666;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .input-actions {
            display: flex;
            gap: 15px;
            color: #aaa;
        }

        .input-actions i {
            cursor: pointer;
            font-size: 20px;
        }

        .message-input {
            flex: 1;
            background-color: #383838;
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            outline: none;
            resize: none;
            max-height: 100px;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        .message-input::placeholder {
            color: #aaa;
        }

        .send-button {
            width: 40px;
            height: 40px;
            background-color: #1D9F7A;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

        .send-button:hover {
            background-color: #178066;
        }

        /* Поиск пользователей */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #4C4C4C;
            border-radius: 10px;
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            border-bottom: 1px solid #666;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background-color: #5a5a5a;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .chats-sidebar {
                width: 100%;
            }
            
            .messages-panel {
                display: none;
            }
            
            .messages-panel.active {
                display: flex;
            }
            
            .back-button {
                display: block;
            }
        }

        /* Скрываем скроллбар но оставляем функциональность */
        .chats-list::-webkit-scrollbar {
            width: 6px;
        }

        .chats-list::-webkit-scrollbar-track {
            background: #383838;
        }

        .chats-list::-webkit-scrollbar-thumb {
            background: #1D9F7A;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #383838;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #1D9F7A;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Левая панель - список чатов -->
        <div class="chats-sidebar">
            <div class="sidebar-header">
                <div class="burger-menu">
                    <div class="burger-line"></div>
                    <div class="burger-line"></div>
                    <div class="burger-line"></div>
                </div>
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="Поиск пользователей по номеру">
                    <div class="search-icon">🔍</div>
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <div class="chats-title">Чаты</div>

            <div class="chats-list" id="chatsList">
                <!-- Чаты будут добавляться динамически -->
                <div class="welcome-message" id="welcomeMessage">
                    Начните общение - найдите пользователя по номеру телефона
                </div>
            </div>
        </div>

        <!-- Правая панель - сообщения -->
        <div class="messages-panel">
            <div class="messages-header">
                <div class="back-button" id="backButton">←</div>
                <div class="current-chat-avatar" id="currentChatAvatar">T</div>
                <div class="current-chat-info">
                    <div class="current-chat-name" id="currentChatName">Telegram</div>
                    <div class="current-chat-status" id="currentChatStatus">онлайн</div>
                </div>
                <div class="header-actions">
                    <i>🔍</i>
                    <i>⋮</i>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message" id="chatWelcomeMessage">
                    Выберите чат для начала общения
                </div>
            </div>

            <div class="input-container">
                <div class="input-actions">
                    <i>📎</i>
                    <i>😊</i>
                </div>
                <textarea class="message-input" id="messageInput" placeholder="Сообщение" rows="1"></textarea>
                <button class="send-button" id="sendButton">↑</button>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = null;
        let currentChatUser = null;
        let allChats = [];

        // Функция для поиска пользователей
        async function searchUsers(query) {
            if (query.length < 3) {
                document.getElementById('searchResults').classList.remove('show');
                return;
            }

            try {
                const response = await fetch(`/.netlify/functions/search-users?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.success) {
                    showSearchResults(data.users);
                }
            } catch (error) {
                console.error('Search error:', error);
            }
        }

        // Показать результаты поиска
        function showSearchResults(users) {
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            users.forEach(user => {
                const resultItem = document.createElement('div');
                resultItem.className = 'search-result-item';
                resultItem.innerHTML = `
                    <div class="chat-avatar user-avatar">${user.phone_number.slice(-1)}</div>
                    <div class="chat-info">
                        <div class="chat-name">${user.phone_number}</div>
                        <div class="chat-last-message">Нажмите чтобы начать чат</div>
                    </div>
                `;
                
                resultItem.addEventListener('click', () => {
                    startChatWithUser(user);
                    resultsContainer.classList.remove('show');
                    document.getElementById('searchInput').value = '';
                });
                
                resultsContainer.appendChild(resultItem);
            });

            resultsContainer.classList.add('show');
        }

        // Начать чат с пользователем
        async function startChatWithUser(user) {
            const currentUserId = localStorage.getItem('userId');
            
            // Создаем временный ID чата (в реальном приложении нужно создавать в базе)
            const chatId = `chat_${currentUserId}_${user.id}`;
            
            currentChatId = chatId;
            currentChatUser = user;
            
            // Обновляем интерфейс
            document.getElementById('currentChatName').textContent = user.phone_number;
            document.getElementById('currentChatAvatar').textContent = user.phone_number.slice(-1);
            document.getElementById('currentChatStatus').textContent = 'онлайн';
            
            // Показываем панель сообщений
            document.getElementById('chatWelcomeMessage').style.display = 'none';
            document.getElementById('messagesContainer').innerHTML = '';
            
            // Загружаем сообщения
            await loadMessages(chatId);
            
            // Добавляем в список чатов
            addChatToList(user, chatId);
        }

        // Добавить чат в список
        function addChatToList(user, chatId) {
            const chatsList = document.getElementById('chatsList');
            const welcomeMessage = document.getElementById('welcomeMessage');
            
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }
            
            // Проверяем, есть ли уже такой чат
            const existingChat = document.querySelector(`[data-chat-id="${chatId}"]`);
            if (existingChat) {
                existingChat.classList.add('active');
                return;
            }
            
            const chatItem = document.createElement('div');
            chatItem.className = 'chat-item active';
            chatItem.dataset.chatId = chatId;
            chatItem.innerHTML = `
                <div class="chat-avatar user-avatar">${user.phone_number.slice(-1)}</div>
                <div class="chat-info">
                    <div class="chat-header">
                        <div class="chat-name">${user.phone_number}</div>
                        <div class="chat-time">только что</div>
                    </div>
                    <div class="chat-last-message">Новый чат</div>
                </div>
            `;
            
            chatItem.addEventListener('click', () => {
                openChat(chatId, user);
            });
            
            chatsList.insertBefore(chatItem, chatsList.firstChild);
            allChats.push({ id: chatId, user: user });
        }

        // Открыть чат
        function openChat(chatId, user) {
            currentChatId = chatId;
            currentChatUser = user;
            
            // Обновляем заголовок
            document.getElementById('currentChatName').textContent = user.phone_number;
            document.getElementById('currentChatAvatar').textContent = user.phone_number.slice(-1);
            
            // Обновляем активный чат в списке
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.chatId === chatId) {
                    item.classList.add('active');
                }
            });
            
            // Загружаем сообщения
            loadMessages(chatId);
            
            // На мобильных показываем панель сообщений
            if (window.innerWidth <= 768) {
                document.querySelector('.messages-panel').classList.add('active');
                document.querySelector('.chats-sidebar').style.display = 'none';
            }
        }

        // Загрузить сообщения
        async function loadMessages(chatId) {
            try {
                const response = await fetch(`/.netlify/functions/get-messages?chatId=${chatId}`);
                const data = await response.json();
                
                const messagesContainer = document.getElementById('messagesContainer');
                messagesContainer.innerHTML = '';
                
                if (data.success && data.messages.length > 0) {
                    data.messages.forEach(message => {
                        addMessageToChat(message, false);
                    });
                } else {
                    messagesContainer.innerHTML = '<div class="welcome-message">Нет сообщений. Начните общение!</div>';
                }
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Добавить сообщение в чат
        function addMessageToChat(message, isNew = false) {
            const messagesContainer = document.getElementById('messagesContainer');
            const welcomeMessage = document.getElementById('chatWelcomeMessage');
            
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }
            
            const messageElement = document.createElement('div');
            const isOutgoing = message.sender_id == localStorage.getItem('userId');
            
            const time = new Date(message.created_at).toLocaleTimeString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            messageElement.className = `message ${isOutgoing ? 'message-outgoing' : 'message-incoming'}`;
            messageElement.innerHTML = `
                <div class="message-text">${message.text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesContainer.appendChild(messageElement);
            
            if (isNew) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        // Отправить сообщение
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentChatId || !currentChatUser) {
                return;
            }

            try {
                const userId = localStorage.getItem('userId');
                
                // Сохраняем сообщение в базу
                const response = await fetch('/.netlify/functions/save-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: currentChatId,
                        sender_id: userId,
                        text: text
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Добавляем сообщение в интерфейс
                    addMessageToChat(data.message, true);
                    
                    // Очищаем поле ввода
                    input.value = '';
                    input.style.height = 'auto';
                }
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }

        // Обработчики событий
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            const sendButton = document.getElementById('sendButton');
            const messageInput = document.getElementById('messageInput');
            const backButton = document.getElementById('backButton');

            // Поиск пользователей
            searchInput.addEventListener('input', (e) => {
                searchUsers(e.target.value);
            });

            // Закрытие результатов поиска при клике вне
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    document.getElementById('searchResults').classList.remove('show');
                }
            });

            // Отправка сообщения
            sendButton.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Авто-высота текстового поля
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Кнопка назад на мобильных
            backButton.addEventListener('click', () => {
                document.querySelector('.messages-panel').classList.remove('active');
                document.querySelector('.chats-sidebar').style.display = 'flex';
            });

            // Проверяем авторизацию
            const userId = localStorage.getItem('userId');
            const userPhone = localStorage.getItem('userPhone');
            
            if (!userId || !userPhone) {
                window.location.href = 'index.html';
            } else {
                console.log('Пользователь авторизован:', { userId, userPhone });
            }
        });
    </script>
</body>
</html>
